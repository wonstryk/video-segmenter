[package]
name = "video-segmenter"
version = "1.0.0"
edition = "2021"
description = "One-click video auto-segmenter"

[dependencies]
eframe = { version = "0.27", default-features = false, features = ["glow", "default_fonts", "x11"] }
rfd = { version = "0.14", default-features = false, features = ["xdg-portal", "async-std"] }
ureq = "2"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
